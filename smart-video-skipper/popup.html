<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SmartVideoSkipper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1><img src="icons/icon-32.png" alt=""> SmartVideoSkipper</h1>
      <p id="site">Loading current tab…</p>
      <label for="allowed"><span>Allow on this site</span><input id="allowed" type="checkbox"></label>
      <label for="enabled"><span>Enable video controls</span><input id="enabled" type="checkbox"></label>
      <button id="settings" type="button">Open in-page settings</button>
      <p class="hint">Settings apply instantly. For local videos, also allow file URL access in the extension details page.</p>
      <p id="status" role="status"></p>
    </main>
    <script src="js/shared.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
